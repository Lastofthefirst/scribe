[project]
name = "scribe-stt"
version = "0.1.0"
description = "Fast, local speech-to-text utility for KDE/Debian systems"
authors = [
    {name = "Scribe Project"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8,<3.14"
keywords = ["speech-to-text", "whisper", "kde", "debian", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "webrtcvad>=2.0.10",
    "pyperclip>=1.8.2",
    "toml>=0.10.2",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
]

[project.scripts]
scribe = "scribe.cli:main"

[project.urls]
Homepage = "https://github.com/Lastofthefirst/scribe"
Repository = "https://github.com/Lastofthefirst/scribe"
Issues = "https://github.com/Lastofthefirst/scribe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --strict-markers --tb=short"

[tool.coverage.run]
source = ["scribe"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
