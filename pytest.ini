[pytest]
# Pytest configuration for Scribe

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=scribe --cov-report=html
[coverage:run]
source = scribe
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require system resources)
    slow: Slow tests that may take several seconds
    audio: Tests requiring audio input/output
    network: Tests requiring network access (model downloads)
